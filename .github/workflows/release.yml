name: Release APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v1.0.1 or v1.0.2-rc.1
        type: string
        required: true

permissions:
  contents: read
concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  # A manual run must itself be started on the same tag so verification and
  # publication always operate on exactly the same source revision.
  validate-ref:
    runs-on: ubuntu-24.04
    steps:
      - name: Require matching tag ref
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$REF" != refs/tags/v* ]]; then
            echo 'Run this workflow on an existing version tag.' >&2
            exit 1
          fi
          if [[ "$EVENT" == workflow_dispatch && "$REF" != "refs/tags/$INPUT_TAG" ]]; then
            echo 'The selected ref and input tag must match.' >&2
            exit 1
          fi
  verify:
    needs: validate-ref
    uses: ./.github/workflows/verify.yml
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Verify tag and monotonic version
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[] | select(.draft == false) | .tag_name' > "$RUNNER_TEMP/published-tags"
          python3 scripts/release.py validate --tag "$RELEASE_TAG" --existing-tags "$RUNNER_TEMP/published-tags"
          if [[ "$RELEASE_TAG" != *-rc.* ]]; then
            if LATEST_TAG="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null)"; then
              printf '%s\n' "$LATEST_TAG" > "$RUNNER_TEMP/latest-stable"
              python3 scripts/release.py validate --tag "$RELEASE_TAG" \
                --existing-tags "$RUNNER_TEMP/published-tags" \
                --latest-stable "$LATEST_TAG" > /dev/null
            fi
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/is-draft"; then
            test "$(cat "$RUNNER_TEMP/is-draft")" = true
          fi
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          umask 077
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/camera-release.p12"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build signed optimized APK
        env:
          REQUIRE_RELEASE_SIGNING: 'true'
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/camera-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --dependency-verification strict :app:assembleRelease
      - name: Verify signature and package release assets
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/signing-certificate.txt"
          CERT_SHA256="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}' "$RUNNER_TEMP/signing-certificate.txt")"
          test -n "$CERT_SHA256"
          python3 scripts/release.py package --tag "$RELEASE_TAG" --repository "$GITHUB_REPOSITORY" --apk app/build/outputs/apk/release/app-release.apk --certificate-sha256 "$CERT_SHA256"
          cp "$RUNNER_TEMP/signing-certificate.txt" dist/signing-certificate.txt
      - name: Create draft and upload all assets
        run: |
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$RELEASE_TAG" --notes-file dist/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" dist/*.apk dist/update.json dist/SHA256SUMS dist/signing-certificate.txt --clobber
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/release-verification" --pattern '*.apk' --pattern update.json --pattern SHA256SUMS
          (cd "$RUNNER_TEMP/release-verification" && sha256sum --check SHA256SUMS)
      - name: Publish complete release
        run: |
          # The REST lookup by tag excludes drafts. gh resolves drafts through
          # GraphQL and exposes the database ID required by the publish API.
          RELEASE_ID="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json databaseId --jq .databaseId)"
          if [[ "$RELEASE_TAG" == *-rc.* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi
          BODY="$(jq -n --argjson prerelease "$PRERELEASE" \
            '{draft:false, prerelease:$prerelease, make_latest:(if $prerelease then "false" else "true" end)}')"
          echo "$BODY" | gh api --method PATCH \
            "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" --input - --silent
      - name: Retain release diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-diagnostics
          path: |
            app/build/outputs/mapping/release
            dist/update.json
            dist/SHA256SUMS
          retention-days: 30
      - name: Remove runner signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/camera-release.p12"
