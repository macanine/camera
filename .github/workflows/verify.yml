name: Verify Android
on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Validate release tooling
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Validate workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= .github/workflows/*.yml
      - name: Test, lint and build optimized release
        run: >-
          ./gradlew --no-daemon --dependency-verification strict
          :app:testDebugUnitTest :app:lintDebug :app:assembleRelease -PsmokeRelease=true
      - name: Validate release metadata round trip
        run: |
          CERT_SHA256="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | awk -F': ' '/Signer #1 certificate SHA-256 digest:/{print $2; exit}')"
          test -n "$CERT_SHA256"
          VERSION="$(awk -F= '$1=="versionName"{print $2}' version.properties)"
          python3 scripts/release.py package --tag "v$VERSION" --repository "$GITHUB_REPOSITORY" --apk app/build/outputs/apk/release/app-release.apk --certificate-sha256 "$CERT_SHA256" --output "$RUNNER_TEMP/dist"
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-reports
          path: |
            app/build/reports
            app/build/outputs/mapping/release
          retention-days: 14

  device:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: platform-tools
      - name: Install compilation SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          script: |
            ./gradlew --no-daemon --dependency-verification strict :app:connectedDebugAndroidTest
            ./gradlew --no-daemon --dependency-verification strict -PdeviceTestBuildType=release -PsmokeRelease=true :app:connectedReleaseAndroidTest
      - name: Upload device reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-reports-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests
            app/build/outputs/connected_android_test_additional_output
          retention-days: 14
